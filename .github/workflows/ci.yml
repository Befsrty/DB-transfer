name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Установка зависимостей
        run: uv sync --locked
      - name: Линтер
        run: uv run ruff check .
      - name: Модульные тесты
        run: uv run pytest --cov=dbtransfer --cov-report=term-missing --cov-fail-under=70

  # Интеграционные тесты с Greengage (ТЗ 4.7, «Ж»): развёртывание пакета SQL и прогон примера приложения Д.
  # 7.5.1 — основная цель (ADB 7.5 / Greengage 7, диалект greenplum7), 6.32.0 — совместимость с ADB 6.x
  # и Yandex MPP (диалект greenplum). Публичного образа ADB нет: Greengage — его открытое ядро (допущение).
  greengage:
    name: greengage ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "7.5.1"
            dialect: greenplum7
          - version: "6.32.0"
            dialect: greenplum
    services:
      greengage:
        image: woblerr/greengage:${{ matrix.version }}
        options: --hostname greengage
        env:
          GREENPLUM_PASSWORD: student
          GREENPLUM_DATABASE_NAME: demo
        ports:
          - 5432:5432
    env:
      DBT_DB_HOST: localhost
      DBT_DB_PORT: "5432"
      DBT_DB_NAME: demo
      DBT_DB_USER: gpadmin
      DBT_DB_PASSWORD: student
      DBT_EXPECT_DIALECT: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Установка зависимостей
        run: uv sync --locked
      - name: Ожидание готовности Greengage
        run: |
          for i in $(seq 1 60); do
            if PGPASSWORD=student psql -h localhost -U gpadmin -d demo -tAc "select 1" >/dev/null 2>&1; then
              echo "Greengage готов"; exit 0
            fi
            sleep 5
          done
          echo "Greengage не поднялся за 5 минут"; exit 1
      - name: Версия сервера
        run: PGPASSWORD=student psql -h localhost -U gpadmin -d demo -tAc "select version()"
      - name: Интеграционные тесты
        run: uv run pytest -m db -v
