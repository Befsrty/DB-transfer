[project]
name = "dbtransfer"
version = "0.1.0"
description = "Прототип переноса структуры хранилища SAP BW в Greenplum/Arenadata DB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "networkx>=3.3",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "streamlit>=1.40",
    "sqlglot>=27",
]

[project.optional-dependencies]
# Драйверы для импорта словаря напрямую из базы; для импорта из CSV не нужны
oracle = ["oracledb>=2.0"]
mssql = ["pymssql>=2.3"]
teradata = ["teradatasql>=20.0"]

[project.scripts]
dbtransfer = "dbtransfer.cli:app"

[dependency-groups]
dev = [
    "clickhouse-connect>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbtransfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: интеграционные тесты, нужен запущенный Greengage (docker compose up -d) или PostgreSQL",
    "clickhouse: интеграционные тесты пакета ClickHouse, нужен сервер ClickHouse (HTTP, порт 8123)",
]
addopts = "-m 'not db and not clickhouse'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
