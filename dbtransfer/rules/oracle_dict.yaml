# Представления словаря Oracle, из которых строится модель (dbtransfer/importers/oracle_dict.py).
#
# Каждое представление выгружается в CSV под своим именем (ALL_TAB_COLUMNS.csv и т. д.)
# запросом из ORACLE_QUERIES в oracle_dict.py, либо читается напрямую при подключении к базе.
# Поля описания — как в bw_tables.yaml: group, purpose, level, required, hypothesis, columns.
# version_column у словаря нет: берутся все строки.

tables:
  ALL_TABLES:
    group: Таблицы
    purpose: Список таблиц схем (что переносить как таблицы)
    level: "1"
    required: true
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      TABLE_NAME: {required: true}
      PARTITIONED: {}
      NUM_ROWS: {}
      TEMPORARY: {}

  ALL_TAB_COLUMNS:
    group: Таблицы
    purpose: Колонки таблиц и представлений, типы и длины
    level: "1"
    required: true
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      TABLE_NAME: {required: true}
      COLUMN_NAME: {required: true}
      COLUMN_ID: {required: true}
      DATA_TYPE: {required: true}
      DATA_LENGTH: {required: true}
      CHAR_LENGTH: {}
      DATA_PRECISION: {required: true}
      DATA_SCALE: {required: true}
      NULLABLE: {required: true}

  ALL_CONSTRAINTS:
    group: Ключи
    purpose: Первичные, уникальные и внешние ключи
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      CONSTRAINT_NAME: {required: true}
      CONSTRAINT_TYPE: {required: true}
      TABLE_NAME: {required: true}
      R_OWNER: {}
      R_CONSTRAINT_NAME: {}
      STATUS: {}

  ALL_CONS_COLUMNS:
    group: Ключи
    purpose: Колонки ключей по порядку
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      CONSTRAINT_NAME: {required: true}
      TABLE_NAME: {required: true}
      COLUMN_NAME: {required: true}
      POSITION: {required: true}

  ALL_TAB_COMMENTS:
    group: Комментарии
    purpose: Комментарии таблиц и представлений
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      TABLE_NAME: {required: true}
      TABLE_TYPE: {}
      COMMENTS: {required: true}

  ALL_COL_COMMENTS:
    group: Комментарии
    purpose: Комментарии колонок
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      TABLE_NAME: {required: true}
      COLUMN_NAME: {required: true}
      COMMENTS: {required: true}

  ALL_VIEWS:
    group: Представления
    purpose: Текст представлений, для отчёта о сложности
    level: "2"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      VIEW_NAME: {required: true}
      TEXT: {}

  ALL_OBJECTS:
    group: Код
    purpose: Процедуры, функции, пакеты, триггеры, материализованные представления
    level: "3"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      OBJECT_NAME: {required: true}
      OBJECT_TYPE: {required: true}
      STATUS: {}

  ALL_SOURCE:
    group: Код
    purpose: Число строк кода PL/SQL по объектам (запрос с GROUP BY, не всё представление)
    level: "3"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      NAME: {required: true}
      TYPE: {required: true}
      LINES: {required: true}

  ALL_PART_TABLES:
    group: Секционирование
    purpose: Вид секционирования таблиц (RANGE, LIST, HASH, интервальное)
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      TABLE_NAME: {required: true}
      PARTITIONING_TYPE: {required: true}
      SUBPARTITIONING_TYPE: {}
      INTERVAL: {}

  ALL_PART_KEY_COLUMNS:
    group: Секционирование
    purpose: Колонки ключа секционирования
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      OWNER: {required: true}
      NAME: {required: true}
      OBJECT_TYPE: {}
      COLUMN_NAME: {required: true}
      COLUMN_POSITION: {required: true}

  ALL_TAB_PARTITIONS:
    group: Секционирование
    purpose: Секции и их границы (HIGH_VALUE)
    level: "1"
    required: false
    hypothesis: false
    version_column: ""
    columns:
      TABLE_OWNER: {required: true}
      TABLE_NAME: {required: true}
      PARTITION_NAME: {required: true}
      PARTITION_POSITION: {required: true}
      HIGH_VALUE: {required: true}
