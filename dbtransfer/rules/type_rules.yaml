# Правила перевода типов, хранения и распределения (ТЗ, 4.3.3, 4.3.4, ФП-5.4, ФП-5.5).
# В проекте можно положить свой type_rules.yaml рядом с project.yaml: его ключи заменят эти.

# Тип ABAP Dictionary -> тип Greengage. {length}, {decimals} — из DD03L / RSDSSEGFD.
types:
  CHAR: "varchar({length})"
  NUMC: "varchar({length})"     # никогда не число: теряются ведущие нули
  DATS: "date"
  TIMS: "time"
  CURR: "numeric({length},{decimals})"
  QUAN: "numeric({length},{decimals})"
  DEC: "numeric({length},{decimals})"
  INT1: "smallint"
  INT2: "smallint"
  INT4: "integer"
  INT8: "bigint"
  FLTP: "double precision"
  LANG: "char(1)"
  CUKY: "varchar({length})"
  UNIT: "varchar({length})"
  STRING: "text"
  SSTRING: "text"
  # Типы реляционных источников (Oracle, MS SQL Server), которых нет в ABAP Dictionary
  FIXCHAR: "char({length})"     # CHAR(n) Oracle и char(n) MS SQL: дополнение пробелами, как в источнике
  NUMERIC: "numeric"            # NUMBER без точности
  TIMESTAMP: "timestamp"        # DATE и TIMESTAMP Oracle, datetime и datetime2 MS SQL
  TIMESTAMPTZ: "timestamptz"    # TIMESTAMP WITH TIME ZONE, datetimeoffset
  BINARY: "bytea"               # RAW, BLOB, varbinary; в CSV — шестнадцатеричная строка
  # Teradata (dbtransfer/importers/teradata.py) использует те же типы модели: CHAR/VARCHAR -> FIXCHAR/CHAR
  # (длина UNICODE в символах), BYTEINT/SMALLINT -> INT2, INTEGER -> INT4, BIGINT -> INT8, DECIMAL и NUMBER(p,s) ->
  # DEC, NUMBER -> NUMERIC, FLOAT -> FLTP, DATE -> DATS, TIME -> TIMS, TIMESTAMP -> TIMESTAMP, TIMESTAMP WITH TIME
  # ZONE -> TIMESTAMPTZ, BYTE/VARBYTE/BLOB -> BINARY, CLOB/XML/PERIOD/UDT/ARRAY -> STRING. INTERVAL, TIME WITH TIME
  # ZONE и JSON переносятся типом цели напрямую (interval day to second, timetz, jsonb). Нераспознанный код типа
  # (DBC.ColumnsV.ColumnType) становится ключом этой таблицы: types: {XX: "text"} в type_rules.yaml проекта.
# Для прочих типов (RAW, ACCP и т. п.)
default_type: "text"

# Пустая дата в ключевом поле хранится как заглушка, а не NULL
date_key_placeholder: "0001-01-01"

# Суммы CURR. BW хранит их во внутреннем формате: всегда 2 знака после запятой, а для валют
# с другим числом знаков запятая сдвинута (1 000 JPY лежат как 10,00). Число знаков валюты — в TCURX.
currency:
  # Как хранить суммы в новой базе: external — настоящие суммы, как в отчётах (1 000 JPY = 1000);
  # internal — как в таблицах BW. Решение 23.11.2026: external.
  store: external
  # В каком формате суммы во входящих CSV: выгрузки и экстракторы SAP дают внутренний формат,
  # плоские файлы (DataSource FILE) пишут люди — в них настоящие суммы.
  input: internal
  input_file: external
  # В каком формате суммы в эталоне сверки: выгрузка SE16 показывает суммы с учётом валюты.
  etalon: external
  # Знаки валют, если в выгрузке нет TCURX.csv: валюты стандартной поставки SAP, у которых не 2 знака.
  # Это допущение: в системе заказчика TCURX может быть настроена иначе, лучше выгрузить TCURX.
  decimals: {JPY: 0, KRW: 0, VND: 0, CLP: 0, ISK: 0, PYG: 0, UGX: 0, XAF: 0, XOF: 0,
             BHD: 3, JOD: 3, KWD: 3, LYD: 3, OMR: 3, TND: 3}

# Хранение таблиц: heap или append-optimized (AO) колоночное со сжатием
storage:
  active: heap
  md: heap
  inbound: ao_column
  change_log: ao_column
  datasource: ao_column
  table: heap             # таблица Oracle / MS SQL при переносе 1:1 с первичным ключом (AO не допускает PRIMARY KEY)
  table_nokey: ao_column  # такая же таблица без ключа
storage_options:
  ao_column: "appendonly=true, orientation=column, compresstype=zstd, compresslevel=1"

# Ключ распределения по умолчанию: первое поле первичного ключа.
# Таблицы без ключа (staging, входные таблицы DataSource) распределяются случайно.
# Переопределение для отдельного объекта:
# overrides:
#   ZSD_A01:
#     distributed_by: [doc_number, s_ord_item]
#     storage: {inbound: heap}
#   ZSALES_FF:
#     currency_input: internal   # формат сумм во входящем файле этого объекта
overrides: {}

# Целевая СУБД ClickHouse (в том числе Yandex Managed Service for ClickHouse): dbtransfer generate --dialect clickhouse.
# Типы выше переводятся второй ступенью: тип PostgreSQL -> тип ClickHouse по базовому имени,
# {p}, {s} — точность и масштаб из numeric(p,s). Колонки без NOT NULL становятся Nullable(...).
clickhouse:
  types:
    varchar: String               # длина varchar(n) в ClickHouse не проверяется
    char: String
    text: String
    numeric: "Decimal({p},{s})"
    smallint: Int16
    integer: Int32
    bigint: Int64
    double precision: Float64
    date: Date32                  # диапазон 1900-01-01 … 2299-12-31
    time: String                  # своего типа времени суток в стабильных версиях нет: строка ЧЧ:ММ:СС
    timestamp: DateTime64(6)       # дробные секунды как у TIMESTAMP Oracle и datetime2 MS SQL
    timestamptz: DateTime64(6, 'UTC')  # момент времени в UTC, как timestamptz в Greengage
    bytea: String                 # двоичные данные (RAW, BLOB, varbinary)
    jsonb: String
  # numeric без точности (служебные таблицы сверки)
  numeric_default: "Decimal(38,10)"
  # Пустая дата в ключевом поле: 0001-01-01 вне диапазона Date32
  date_key_placeholder: "1900-01-01"
  # Движок таблицы по роли. Для кластера из нескольких хостов в Yandex Cloud замените на
  # ReplicatedMergeTree / ReplicatedReplacingMergeTree (тогда DDL нужно выполнять с ON CLUSTER).
  engines:
    md_attr: ReplacingMergeTree   # повторная загрузка справочника заменяет строку по ключу
    md_text: ReplacingMergeTree
    active: MergeTree             # замена строк — DELETE + INSERT в шагах активации
    inbound: MergeTree
    change_log: MergeTree
    datasource: MergeTree
    work: MergeTree
    meta: MergeTree
